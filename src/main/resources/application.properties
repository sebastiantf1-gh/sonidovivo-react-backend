spring.application.name=sonidovivo-backend
server.port=8080
server.address=0.0.0.0
# Todas las rutas quedan bajo /api (ej: /api/v1/auth/login)
server.servlet.context-path=/api

# Base de datos MySQL (la clave NO va en el repo: variable de entorno DB_PASS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sonidovivo}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT (el secreto NO va en el repo: variable de entorno JWT_SECRET, minimo 32 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.issuer=sonidovivo-backend
jwt.audience=sonidovivo-frontend

# CORS: origenes permitidos del frontend, separados por coma
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Swagger UI: /api/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.config.import=optional:file:.env[.properties]